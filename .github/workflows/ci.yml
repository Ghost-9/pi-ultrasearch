name: CI & Benchmark Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # macOS is the reference platform: the real daemon, the engine crate and the
  # live benchmark gate all run here.
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Secret scanning. Runs before the build so a leaked key fails fast and
      # never reaches a cache or artifact. Uses .gitleaks.toml, which allowlists
      # only the redaction fixtures this suite tests against.
      # The gitleaks CLI, not gitleaks/gitleaks-action: the action now refuses to run
      # without a paid licence for organisation accounts ("missing gitleaks license"),
      # which turned this step red for a reason unrelated to the code - twice in one
      # session, and once on a commit that changed only a test. The CLI is the same
      # scanner under MIT, so the scan is unchanged and the gate is honest again.
      - name: Secret scan (gitleaks CLI)
        run: |
          VERSION=8.28.0
          # Retried: the release CDN answers 504 under load, which turned a secret scan
          # red for a network reason twice in one session. A scanner that cannot be
          # downloaded must not read as "a secret was found", and a transient 5xx is not
          # worth a failed run.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_darwin_arm64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build distribution (dist/)
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Package smoke test (npm pack + built CLI)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$(ls "$RUNNER_TEMP"/pi-ultrasearch-*.tgz)"
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/tarlist.txt"
          grep -q 'package/dist/bin/cli.js' "$RUNNER_TEMP/tarlist.txt"
          grep -q 'package/dist/src/client.js' "$RUNNER_TEMP/tarlist.txt"
          mkdir -p "$RUNNER_TEMP/packed"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/packed"
          node "$RUNNER_TEMP/packed/package/dist/bin/cli.js" --help > "$RUNNER_TEMP/help.txt"
          grep -q "PI-ULTRASEARCH" "$RUNNER_TEMP/help.txt"

      - name: Harness smoke matrix (protocol arms; native arms only where installed)
        run: npm run smoke:harness

      - name: Harness matrix check (fresh artifacts from this commit)
        run: npm run matrix:harness -- --check --require-fresh

      - name: Judgment-set integrity gate (no silent edits to the instruments)
        run: npm run judgments:integrity

      - name: Judgment-set integrity gate tests
        run: npm run judgments:integrity:test

      - name: Engine unit tests (cargo test --release)
        run: cargo test --release --manifest-path engine/Cargo.toml

      # Style is enforced, not hoped for. Runestone's tree went from 91 warnings to
      # zero and its gate now fails on a single new one; this is the same rule here.
      # Both are cheap and deterministic, so there is no reason to ratchet instead.
      - name: Engine formatting
        run: cargo fmt --all --manifest-path engine/Cargo.toml --check

      - name: Engine lints (must be zero)
        run: |
          count=$(cargo clippy --release --all-targets --manifest-path engine/Cargo.toml 2>&1 | grep -cE '^warning: ' || true)
          echo "clippy warnings: $count (must be 0)"
          test "$count" -eq 0

      - name: Build engine daemon (release)
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Engine integration tests (real isolated daemon)
        run: npm run test:engine

      # The 2,671 MB / 67-compaction defect was a *time* behaviour: it needed the
      # daemon to run against a churning tree before it appeared, and nothing in
      # this workflow ran long enough to see it. This does, briefly, and asserts the
      # properties that failed: compactions bounded, event lag bounded, RSS flat, the
      # daemon still answering, and a file created seconds ago still findable.
      # `python3 scripts/soak.py --hours 48` runs the real weekend soak.
      - name: Soak (churn, bounded compactions and lag, live follower)
        run: python3 scripts/soak.py --seconds 60

      - name: Benchmark gate (hermetic strict + live floor-derived)
        run: npm run test:gate

  # Linux runs the client surface: typecheck, unit tests (integration skips
  # cleanly), the package smoke test and the hermetic gate. The daemon does
  # not build on Linux yet (see docs/linux-daemon-blockers.md), so no live gate
  # and no engine tests here.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build distribution (dist/)
        run: npm run build

      - name: Run Unit Tests (integration skips without a daemon)
        run: npm test

      - name: Package smoke test (npm pack + built CLI)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$(ls "$RUNNER_TEMP"/pi-ultrasearch-*.tgz)"
          tar -tzf "$TARBALL" > "$RUNNER_TEMP/tarlist.txt"
          grep -q 'package/dist/bin/cli.js' "$RUNNER_TEMP/tarlist.txt"
          mkdir -p "$RUNNER_TEMP/packed"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/packed"
          node "$RUNNER_TEMP/packed/package/dist/bin/cli.js" --help > "$RUNNER_TEMP/help.txt"
          grep -q "PI-ULTRASEARCH" "$RUNNER_TEMP/help.txt"

      - name: Benchmark gate (hermetic mock; live part skipped without a daemon)
        run: npm run test:gate

      - name: Harness smoke matrix (protocol arms; native arms skip without the harness)
        run: npm run smoke:harness

      - name: Harness matrix check (fresh artifacts from this commit)
        run: npm run matrix:harness -- --check --require-fresh

      - name: "Chain smoke test (no daemon: the CLI must fail with a clear message)"
        run: |
          set +e
          OUT="$(PI_ULTRASEARCH_SOCKET="$RUNNER_TEMP/missing.sock" PI_ULTRASEARCH_NO_SPAWN=1 node dist/bin/cli.js compact 2>&1)"
          RC=$?
          set -e
          test "$RC" -ne 0
          printf '%s\n' "$OUT"

  # Documents the Linux daemon port blocker instead of leaving it implicit.
  # Expected to fail until docs/linux-daemon-blockers.md is emptied; the job is
  # visible (not gating) and uploads the compiler output as an artifact.
  linux-daemon-blockers:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Attempt the daemon build (captured as evidence)
        run: |
          set +e
          cargo check --locked --manifest-path engine/Cargo.toml > "$RUNNER_TEMP/linux-daemon-check.log" 2>&1
          RC=$?
          set -e
          echo "cargo check exit: $RC"
          grep -c '^error' "$RUNNER_TEMP/linux-daemon-check.log" || true
          tail -40 "$RUNNER_TEMP/linux-daemon-check.log"
          # The check must fail with the documented blockers, not pass silently.
          test "$RC" -ne 0

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-daemon-check
          path: ${{ runner.temp }}/linux-daemon-check.log
          if-no-files-found: warn
